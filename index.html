<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas - SENAI</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Fundo definido diretamente no código -->
    <div class="imagem-fundo" id="imagem-fundo"></div>

    <div class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">

            <div class="perfil-area">

                <!-- Foto de perfil definida diretamente no código -->
                <div class="foto-perfil">
                    <img
                        id="imagem-perfil"
                        src="20464.jpg"
                        alt="Foto de perfil">
                </div>

                <div>
                    <h1>Minhas Tarefas</h1>
                    <p class="subtitulo">Organize seu dia</p>
                </div>

            </div>

            <button
                class="botao-icone"
                id="botao-alterar-tema"
                aria-label="Alternar tema claro/escuro"
                title="Alternar tema">

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>


        <div class="caixa-entrada">

            <input
                type="text"
                id="campo-tarefa"
                placeholder="O que vamos fazer hoje?..."
                maxlength="40"
                autocomplete="off">

            <button
                class="botao-principal"
                id="botao-adicionar">

                <i class="fa-solid fa-plus"></i>
                Adicionar

            </button>

        </div>


        <p
            class="mensagem-erro"
            id="mensagem-erro"
            role="alert"
            hidden>
        </p>


        <ul
            class="lista-tarefas"
            id="lista-tarefas">

            <!-- As tarefas serão inseridas pelo JavaScript -->

        </ul>


        <footer class="rodape-aplicacao">

            <span id="contador-tarefas">
                0 tarefas na lista
            </span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
